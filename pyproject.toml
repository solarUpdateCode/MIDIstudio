[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midistudio"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "muscriptor>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "mido>=1.3.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
stems = ["demucs>=4.0.1"]

[project.scripts]
midistudio = "midistudio.server:cli"
